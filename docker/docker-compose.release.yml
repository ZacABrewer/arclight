# Same as docker-compose.yml but pulls the published image instead of building.
# Pin a version with ARCLIGHT_IMAGE=ghcr.io/<owner>/arclight:vX.Y.Z in .env.
# Development/compose-from-source stack with a VPN. Arclight (and optionally
# qBittorrent) share Gluetun's network namespace (network_mode: "service:gluetun"), so all their traffic leaves
# through the ProtonVPN WireGuard tunnel and Gluetun's firewall blocks everything else
# (a kill switch by construction). Ports are therefore published on the gluetun service.
# Without a VPN, use docker-compose.novpn.yml. For the published image, see README.md.
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    labels:
      # Opt in to Arclight self-update (Settings > Updates, mode "auto").
      - arclight.autoupdate=true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTON_WIREGUARD_KEY}
      - SERVER_COUNTRIES=${VPN_COUNTRIES:-Netherlands}
      # Proton assigns a forwarded port (NAT-PMP); Arclight moves its torrent engine onto it.
      - VPN_PORT_FORWARDING=on
      # Let LAN clients reach the published UIs through Gluetun's firewall.
      # The compose subnet (see `networks` below) is allowed too, so Arclight reaches whisper.
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET:-192.168.1.0/24},${ARCLIGHT_SUBNET:-172.30.53.0/24}
      # Control server polled by Arclight (status, public IP, forwarded port).
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=off
      # Newer Gluetun releases require auth on the control server. If yours does, create a key
      # (docker run --rm qmcgaw/gluetun genkey), configure it per the Gluetun wiki
      # ("Control server" / auth roles) and enter the same key in Settings -> VPN.
      - TZ=${TZ:-UTC}
    # Containers sharing this network namespace (Arclight) share this hosts file.
    extra_hosts:
      - "whisper:${WHISPER_IP:-172.30.53.200}"
    volumes:
      - ${CONFIG_ROOT:-./data}/gluetun:/gluetun
    ports:
      - "7878:7878" # Arclight
      # - "8080:8080" # qBittorrent WebUI (only with --profile qbittorrent)
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # Cloudflare challenge solver (docs/CLOUDFLARE.md). Shares Gluetun's network namespace so
  # its headless browser egresses through the VPN with the same IP as Arclight; port 8191 is
  # reachable from Arclight as localhost:8191 and is not published.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    labels:
      # Opt in to Arclight self-update (Settings > Updates, mode "auto").
      - arclight.autoupdate=true
    network_mode: "service:gluetun"
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8191/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy

  arclight:
    image: ${ARCLIGHT_IMAGE:-ghcr.io/zacabrewer/arclight:latest}
    container_name: arclight
    labels:
      # Opt in to Arclight self-update (Settings > Updates, mode "auto").
      - arclight.autoupdate=true
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      # Default for Settings -> VPN -> Gluetun control URL (same network namespace).
      - ARCLIGHT_VPN_CONTROL_URL=http://localhost:8000
      # Gluetun control-server API key; scripts/gluetun-auth.sh writes the matching auth file.
      - ARCLIGHT_VPN_API_KEY=${GLUETUN_API_KEY:-}
      # Bundled FlareSolverr (same network namespace); registered as an indexer proxy on boot.
      - ARCLIGHT_FLARESOLVERR_URL=http://localhost:8191
      # Bundled Whisper (profile "whisper"), resolved through gluetun's extra_hosts entry.
      - ARCLIGHT_WHISPER_URL=http://whisper:9000
    volumes:
      - ${CONFIG_ROOT:-./data}/arclight:/config
      # Self-update (Settings > Updates, mode "auto"): uncomment to let Arclight pull images and
      # recreate the containers labelled arclight.autoupdate=true. This gives Arclight root-equivalent
      # control of the Docker host; leave it commented to stay in "notify only" mode.
      # - /var/run/docker.sock:/var/run/docker.sock
      # One share for downloads and library (downloads/, media/tv/, media/movies/): imports
      # are instant hard links only when both live under the same mount.
      - ${DATA_ROOT:-./data/share}:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7878/api/v1/system/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Hardware transcoding (Intel Quick Sync / VA-API): pass the GPU through.
    # Devices go on this service even though it shares gluetun's network.
    # The entrypoint gives the app user the device's group, so PUID/PGID need not change.
    # Check Settings > Transcode > Hardware acceleration afterwards (docs/using/hardware-transcoding.md).
    # devices:
    #   - /dev/dri:/dev/dri
    # NVIDIA instead (needs the NVIDIA Container Toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video]
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
      flaresolverr:
        condition: service_started

  # Optional external client. Arclight's built-in torrent engine is the default and needs no
  # extra container; start qBittorrent too only if you want it: docker compose --profile qbittorrent up -d
  qbittorrent:
    profiles: ["qbittorrent"]
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    labels:
      # Opt in to Arclight self-update (Settings > Updates, mode "auto").
      - arclight.autoupdate=true
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT:-./data}/qbittorrent:/config
      - ${DATA_ROOT:-./data/share}:/data
    # No peer port mapping: the incoming port is the one Proton forwards, set automatically.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy

  # Opt-in speech-to-text for subtitles (the "whisperai" provider): start it with
  #   docker compose -f <this file> --profile whisper up -d
  # Arclight's WhisperAutoDetect job finds it through ARCLIGHT_WHISPER_URL and registers it as the
  # lowest-priority subtitle provider, used only when no other provider has a result. Models are
  # cached under ${CONFIG_ROOT}/whisper. CPU by default; ASR_MODEL=small/medium is slower but better.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    # GPU (NVIDIA Container Toolkit): use the -gpu image and uncomment the deploy block.
    # image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    container_name: whisper
    profiles: ["whisper"]
    labels:
      # Opt in to Arclight self-update (Settings > Updates, mode "auto").
      - arclight.autoupdate=true
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=faster_whisper
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT:-./data}/whisper:/root/.cache
    # Not behind the VPN: it sits on the compose network with a fixed address. Arclight lives in
    # Gluetun's network namespace, so it reaches whisper through Gluetun: the `extra_hosts` entry
    # on gluetun resolves the name and FIREWALL_OUTBOUND_SUBNETS lets the traffic out of the tunnel's
    # firewall to the compose subnet.
    networks:
      default:
        ipv4_address: ${WHISPER_IP:-172.30.53.200}
    restart: unless-stopped

# Fixed compose subnet so Gluetun's firewall can allow it (FIREWALL_OUTBOUND_SUBNETS) and the
# whisper service can have a fixed address. Dynamic addresses stay in the lower half. If the
# subnet collides with another Docker network, set ARCLIGHT_SUBNET / ARCLIGHT_SUBNET_DYNAMIC /
# WHISPER_IP in .env. Changing it needs `docker compose down` once (the network is recreated).
networks:
  default:
    ipam:
      config:
        - subnet: ${ARCLIGHT_SUBNET:-172.30.53.0/24}
          ip_range: ${ARCLIGHT_SUBNET_DYNAMIC:-172.30.53.0/25}
