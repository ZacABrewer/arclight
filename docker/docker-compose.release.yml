# Same as docker-compose.yml but pulls the published image instead of building.
# Pin a version with MEDIATRON_IMAGE=ghcr.io/<owner>/media-tron:vX.Y.Z in .env.
# Development/compose-from-source stack with a VPN. Media-Tron and qBittorrent share
# Gluetun's network namespace (network_mode: "service:gluetun"), so all their traffic leaves
# through the ProtonVPN WireGuard tunnel and Gluetun's firewall blocks everything else
# (a kill switch by construction). Ports are therefore published on the gluetun service.
# Without a VPN, use docker-compose.novpn.yml. For the published image, see README.md.
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTON_WIREGUARD_KEY}
      - SERVER_COUNTRIES=${VPN_COUNTRIES:-Netherlands}
      # Proton assigns a forwarded port (NAT-PMP); Media-Tron pushes it to qBittorrent.
      - VPN_PORT_FORWARDING=on
      # Let LAN clients reach the published UIs through Gluetun's firewall.
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET:-192.168.1.0/24}
      # Control server polled by Media-Tron (status, public IP, forwarded port).
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=off
      # Newer Gluetun releases require auth on the control server. If yours does, create a key
      # (docker run --rm qmcgaw/gluetun genkey), configure it per the Gluetun wiki
      # ("Control server" / auth roles) and enter the same key in Settings -> VPN.
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT:-./data}/gluetun:/gluetun
    ports:
      - "7878:7878" # Media-Tron
      - "8080:8080" # qBittorrent WebUI
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  media-tron:
    image: ${MEDIATRON_IMAGE:-ghcr.io/media-tron/media-tron:latest}
    container_name: media-tron
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      # Default for Settings -> VPN -> Gluetun control URL (same network namespace).
      - MEDIATRON_VPN_CONTROL_URL=http://localhost:8000
    volumes:
      - ${CONFIG_ROOT:-./data}/media-tron:/config
      - ${TV_ROOT:-./data/tv}:/tv
      - ${MOVIES_ROOT:-./data/movies}:/movies
      - ${DOWNLOADS_ROOT:-./data/downloads}:/downloads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7878/api/v1/system/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT:-./data}/qbittorrent:/config
      - ${DOWNLOADS_ROOT:-./data/downloads}:/downloads
    # No peer port mapping: the incoming port is the one Proton forwards, set automatically.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
