# Same as docker-compose.novpn.yml but pulls the published image instead of building.
# Pin a version with ARCLIGHT_IMAGE=ghcr.io/<owner>/arclight:vX.Y.Z in .env.
# Development/compose-from-source stack WITHOUT a VPN (plain layout). The default
# docker-compose.yml routes Arclight and qBittorrent through Gluetun; use this file with
#   docker compose -f docker-compose.novpn.yml up -d
# when you do not use a VPN. For the published image, see README.md.
services:
  arclight:
    image: ${ARCLIGHT_IMAGE:-ghcr.io/arclight/arclight:latest}
    container_name: arclight
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      # Bundled FlareSolverr; registered as an indexer proxy on boot.
      - ARCLIGHT_FLARESOLVERR_URL=http://flaresolverr:8191
    volumes:
      - ${CONFIG_ROOT:-./data}/arclight:/config
      - ${TV_ROOT:-./data/tv}:/tv
      - ${MOVIES_ROOT:-./data/movies}:/movies
      - ${DOWNLOADS_ROOT:-./data/downloads}:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - flaresolverr

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT:-./data}/qbittorrent:/config
      - ${DOWNLOADS_ROOT:-./data/downloads}:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  # Cloudflare challenge solver (docs/CLOUDFLARE.md). Internal only: Arclight reaches it as
  # http://flaresolverr:8191 on the compose network; no port is published.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8191/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
