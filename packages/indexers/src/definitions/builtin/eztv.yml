# Authored for Arclight. EZTV's JSON API lists recent TV torrents and can filter by IMDb
# id; keyword searches fall back to the latest list filtered with `andmatch`.
# `test` requests the plain latest-torrents listing (no imdb_id, no keyword), which the
# API always fills, instead of the generic keyword probe that `andmatch` filters to nothing.
# Verified 2026-10-26 through a VPN-routed request to
# https://eztvx.to/api/get-torrents?limit=30&page=1 (and ?imdb_id=0944947): the API no longer
# returns `torrent_url` or `episode_url`, only `magnet_url`, so the magnet is the download link
# and there is no details URL (the /ep/ pages sit behind a Cloudflare challenge).
# Only eztvx.to was checked; the other links are kept as mirrors.
schemaVersion: 1
id: eztv
name: EZTV
description: "Public TV tracker via its JSON API"
language: en-US
type: public
encoding: UTF-8
tested: true
links:
  - https://eztvx.to/
  - https://eztv.wf/
  - https://eztv.tf/
  - https://eztv.yt/
legacylinks:
  - https://eztv.re/
  - https://eztv.ag/

settings: []

caps:
  categorymappings:
    - {id: TV, cat: TV, desc: "TV"}
    - {id: SD, cat: TV/SD, desc: "TV SD"}
    - {id: HD, cat: TV/HD, desc: "TV HD"}
    - {id: UHD, cat: TV/UHD, desc: "TV UHD"}
  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid]

test:
  path: "api/get-torrents"
  inheritInputs: false
  inputs:
    limit: 30
    page: 1
  response:
    type: json

search:
  paths:
    - path: "api/get-torrents"
      response:
        type: json
  inputs:
    imdb_id: "{{ .Query.IMDBIDShort }}"
    limit: 100
    page: 1
  rows:
    selector: "torrents"
    filters:
      - name: andmatch
    missingAttributeEqualsNoResults: true
    count:
      selector: torrents_count
  fields:
    title:
      selector: title
    category:
      selector: title
      filters:
        - {name: re_replace, args: ["(?i).*\\b(2160p|4k)\\b.*", "UHD"]}
        - {name: re_replace, args: ["(?i).*\\b(720p|1080p)\\b.*", "HD"]}
        - {name: re_replace, args: ["^(?!UHD$|HD$).*$", "SD"]}
    category_all:
      text: TV
    download:
      selector: magnet_url
    infohash:
      selector: hash
    size:
      selector: size_bytes
    date:
      selector: date_released_unix
    seeders:
      selector: seeds
    leechers:
      selector: peers
    imdbid:
      selector: imdb_id
      optional: true
    poster:
      selector: small_screenshot
      optional: true
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
