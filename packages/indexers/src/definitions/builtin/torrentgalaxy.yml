# Authored for Arclight. Verified 2026-10-26 through VPN-routed requests: torrentgalaxy.one
# (and .info, same site) moved to a new layout. The old `torrents.php` search answers 404;
# searches are now `get-posts/?keywords=<terms>` and list rows in `div.tgxtable` with a
# category *name* (Movies, TV, ...), a details link (`/post-detail/<id>/<slug>/`), size,
# seeders/leechers and a relative age ("6 months", "1 year, 2 months"). Result rows carry no
# magnet: the magnet (and an itorrents.org .torrent link) sit on the details page, so the
# details URL is the download link and `download.selectors` picks the magnet there.
# No Cloudflare challenge was seen. tgx.rs no longer resolves and was removed.
schemaVersion: 1
id: torrentgalaxy
name: TorrentGalaxy
description: "Public general tracker (HTML, magnet on the details page)"
language: en-US
type: public
encoding: UTF-8
tested: true
requestDelay: 3
links:
  - https://torrentgalaxy.one/
  - https://torrentgalaxy.info/
legacylinks:
  - https://torrentgalaxy.to/
  - https://torrentgalaxy.mx/
  - https://tgx.rs/

settings: []

caps:
  categorymappings:
    - {id: Movies, cat: Movies, desc: "Movies"}
    - {id: TV, cat: TV, desc: "TV"}
    - {id: Anime, cat: TV/Anime, desc: "Anime"}
    - {id: Documentaries, cat: TV/Documentary, desc: "Documentaries"}
    - {id: Games, cat: PC/Games, desc: "Games"}
    - {id: Apps, cat: PC, desc: "Apps"}
    - {id: Music, cat: Audio, desc: "Music"}
    - {id: Books, cat: Books, desc: "Books"}
    - {id: XXX, cat: XXX, desc: "XXX"}
    - {id: Other, cat: Other, desc: "Other"}
  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid]
    movie-search: [q, imdbid]

search:
  paths:
    - path: "get-posts/"
  inputs:
    keywords: "{{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ .Keywords }}{{ end }}"
  rows:
    selector: "div.tgxtable div.tgxtablerow:has(a[href^=\"/post-detail/\"])"
  fields:
    category:
      selector: "a[href^=\"/get-posts/category:\"]"
      attribute: href
      optional: true
      default: "Other"
      filters:
        - {name: regexp, args: "category:([A-Za-z]+)"}
    title:
      selector: "div.tgxtablecell a[href^=\"/post-detail/\"][title]"
      attribute: title
    details:
      selector: "div.tgxtablecell a[href^=\"/post-detail/\"][title]"
      attribute: href
    download:
      selector: "div.tgxtablecell a[href^=\"/post-detail/\"][title]"
      attribute: href
    imdbid:
      selector: "a[href^=\"/imdb-detail/tt\"]"
      attribute: href
      optional: true
    size:
      selector: "span.badge-secondary"
    grabs:
      selector: "span[title=\"Views\"]"
      optional: true
      default: "0"
    seeders:
      selector: "span[title=\"Seeders/Leechers\"] font:nth-of-type(1)"
    leechers:
      selector: "span[title=\"Seeders/Leechers\"] font:nth-of-type(2)"
    date:
      selector: "div.tgxtablecell:last-child"
      remove: "div"
      optional: true
      filters:
        - {name: timeago}
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1

download:
  selectors:
    - selector: "a.dl-magnet[href^=\"magnet:\"]"
      attribute: href
    - selector: "a[href^=\"magnet:\"]"
      attribute: href
    - selector: "a.dl-torrent[href*=\".torrent\"]"
      attribute: href
