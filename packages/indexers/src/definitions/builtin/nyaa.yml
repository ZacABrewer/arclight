# Authored for Media-Tron. Nyaa serves its search results as RSS with a `nyaa:` namespace
# carrying seeders/leechers/size/info hash. Not yet verified (tested: false).
schemaVersion: 1
id: nyaa
name: Nyaa
description: "Public anime and East-Asian media tracker (RSS search)"
language: en-US
type: public
encoding: UTF-8
tested: false
links:
  - https://nyaa.si/

settings:
  - name: filter
    type: select
    label: Filter
    default: "0"
    options:
      "0": No filter
      "1": No remakes
      "2": Trusted only
  - name: category
    type: select
    label: Site category searched
    default: "0_0"
    options:
      "0_0": All categories
      "1_0": Anime
      "1_2": Anime - English-translated
      "4_0": Live Action
  - name: info_category_8000
    type: info_category_8000
    label: About categories
    default: "Uncategorised items map to Other (8000)."

caps:
  categorymappings:
    - {id: 1_1, cat: TV/Anime, desc: "Anime - Anime Music Video"}
    - {id: 1_2, cat: TV/Anime, desc: "Anime - English-translated"}
    - {id: 1_3, cat: TV/Anime, desc: "Anime - Non-English-translated"}
    - {id: 1_4, cat: TV/Anime, desc: "Anime - Raw"}
    - {id: 2_1, cat: Audio/Lossless, desc: "Audio - Lossless"}
    - {id: 2_2, cat: Audio/MP3, desc: "Audio - Lossy"}
    - {id: 3_1, cat: Books/EBook, desc: "Literature - English-translated"}
    - {id: 3_2, cat: Books/Foreign, desc: "Literature - Non-English-translated"}
    - {id: 3_3, cat: Books/Foreign, desc: "Literature - Raw"}
    - {id: 4_1, cat: TV, desc: "Live Action - English-translated"}
    - {id: 4_2, cat: TV/Other, desc: "Live Action - Idol/Promotional Video"}
    - {id: 4_3, cat: TV/Foreign, desc: "Live Action - Non-English-translated"}
    - {id: 4_4, cat: TV/Foreign, desc: "Live Action - Raw"}
    - {id: 5_1, cat: Other, desc: "Pictures - Graphics"}
    - {id: 5_2, cat: Other, desc: "Pictures - Photos"}
    - {id: 6_1, cat: PC, desc: "Software - Applications"}
    - {id: 6_2, cat: PC/Games, desc: "Software - Games"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]

search:
  paths:
    - path: "/"
      response:
        type: xml
  inputs:
    page: rss
    q: "{{ .Keywords }}"
    c: "{{ .Config.category }}"
    f: "{{ .Config.filter }}"
  keywordsfilters:
    # Anime releases are usually numbered by absolute episode; drop SxxEyy noise.
    - {name: re_replace, args: ["\\bS\\d{2}(E\\d{2,3})?\\b", ""]}
    - {name: trim}
  rows:
    selector: "item"
  fields:
    title:
      selector: title
    download:
      selector: link
    details:
      selector: guid
    date:
      selector: pubDate
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    grabs:
      selector: downloads
    infohash:
      selector: infoHash
    size:
      selector: size
    category:
      selector: categoryId
    description:
      selector: category
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
