# Test fixture written for Arclight: a private tracker whose login shows an image captcha.
id: betaprivate
name: BetaPrivate
description: "Private test tracker with a login captcha"
language: de-DE
type: private
encoding: UTF-8
links:
  - https://beta.example/

caps:
  categorymappings:
    - {id: 10, cat: TV/Anime, desc: "Anime"}
    - {id: 11, cat: Audio/MP3, desc: "Music"}
  modes:
    search: [q]

settings:
  - {name: username, type: text, label: Username}
  - {name: password, type: password, label: Password}

login:
  method: form
  path: login.php
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
  captcha:
    type: image
    selector: "img#captcha"
    input: captcha_code
  test:
    path: index.php
    selector: "a[href*='logout']"

search:
  paths:
    - path: browse.php
  inputs:
    q: "{{ .Keywords }}"
  rows:
    selector: "tr.torrent"
  fields:
    title:
      selector: "a.title"
    download:
      selector: "a.dl"
      attribute: href
    size:
      selector: "td.size"
    seeders:
      selector: "td.seeds"
    leechers:
      selector: "td.peers"
    date:
      text: now
