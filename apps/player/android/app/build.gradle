import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def arclightVersionName() {
    def pkg = new JsonSlurper().parse(rootProject.file('../package.json'))
    return pkg.version as String
}

def arclightVersionCode() {
    def fromEnv = System.getenv("ARCLIGHT_VERSION_CODE")
    if (fromEnv?.trim()) {
        def code = fromEnv.trim().toInteger()
        if (code <= 1) throw new GradleException("ARCLIGHT_VERSION_CODE must be greater than 1, got ${code}")
        return code
    }
    def m = (arclightVersionName() =~ /^(\d+)\.(\d+)\.(\d+)/)
    if (!m.find()) throw new GradleException("apps/player/package.json version is not semver: ${arclightVersionName()}")
    def (major, minor, patch) = [m.group(1), m.group(2), m.group(3)].collect { it.toInteger() }
    if (minor > 99 || patch > 99) throw new GradleException("minor and patch must stay below 100 for the derived versionCode")
    def code = major * 10000 + minor * 100 + patch
    if (code <= 1) throw new GradleException("derived versionCode ${code} must be greater than 1")
    return code
}

android {
    namespace = "com.moviemethat.arclight"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.moviemethat.arclight"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The app's version is the repo's (apps/player/package.json, kept in step by
        // scripts/bump-version.mjs). versionCode: ARCLIGHT_VERSION_CODE when set, else derived
        // from it as major*10000 + minor*100 + patch, so every release raises it.
        versionCode arclightVersionCode()
        versionName arclightVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing from the environment (CI writes the keystore from GitHub secrets; see
    // apps/player/README.md). Without these variables release builds are unsigned.
    signingConfigs {
        release {
            def ks = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // ArclightPlayer: Media3 (ExoPlayer, MediaLibraryService for the notification, lock screen,
    // headsets and Android Auto; the full-screen video player), WorkManager (downloads), Google Cast (optional at runtime).
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-datasource:$media3Version"
    // Converted video (0.24): HLS with fMP4 segments, adaptive across the server's ladder.
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    // Video (movies & TV): PlayerView for the surface and subtitles; the controls are our own.
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.work:work-runtime:$workManagerVersion"
    implementation "androidx.mediarouter:mediarouter:$mediaRouterVersion"
    implementation "com.google.android.gms:play-services-cast-framework:$castFrameworkVersion"
    testImplementation "junit:junit:$junitVersion"
    // The real org.json for JVM unit tests (android.jar only has stubs).
    testImplementation "org.json:json:$orgJsonVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Release builds must carry the web bundle of the same version: Gradle packages whatever is in
// assets/public, so a skipped or failed `pnpm --filter ./apps/player build` + `cap sync` would
// ship the previous release's screens inside the new app (it happened once, in 0.24.0).
tasks.register('checkWebBundleVersion') {
    def assetsDir = file('src/main/assets/public/assets')
    inputs.dir(assetsDir).optional()
    doLast {
        def version = arclightVersionName()
        def scripts = assetsDir.exists() ? assetsDir.listFiles().findAll { it.name.endsWith('.js') } : []
        if (scripts.isEmpty()) {
            throw new GradleException("No web bundle in ${assetsDir}: run `pnpm --filter ./apps/player build` from the repo root, then `npx cap sync android`")
        }
        if (!scripts.any { it.getText('UTF-8').contains("\"${version}\"") }) {
            throw new GradleException("The web bundle in ${assetsDir} is not version ${version}: run `pnpm --filter ./apps/player build` from the repo root, then `npx cap sync android`")
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'checkWebBundleVersion' }
