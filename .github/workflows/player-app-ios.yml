name: Player app (iOS)

# Builds the Arclight listening app (apps/player, Capacitor) for the iOS simulator, unsigned:
# proves the Swift side (AVFoundation player, downloads, CarPlay, AirPlay) compiles on every
# change. CarPlay stays off (CARPLAY_ENABLED=NO), so no Apple-granted entitlement is needed.
# Also checks that version.xcconfig matches package.json and that the privacy manifest is in the
# built app. No secrets: signing and store uploads are in player-app-release.yml (manual runs only).

on:
  push:
    branches: [main]
    paths:
      - 'apps/player/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/player-app-ios.yml'
  pull_request:
    paths:
      - 'apps/player/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/player-app-ios.yml'
  workflow_dispatch:

concurrency:
  group: player-app-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Version and build number match package.json
        run: node scripts/ios-version.mjs --check
      - name: Build web assets
        run: pnpm build
      - name: Capacitor sync
        run: npx cap sync ios
      - name: Unsigned simulator build
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/xcodebuild.log | tail -n 80
      - name: Check the built app
        run: |
          APP=build/sim/Build/Products/Debug-iphonesimulator/App.app
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy is missing from the app bundle"; exit 1; }
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          WANT_VERSION=$(node -p "require('./package.json').version.replace(/-.*/, '')")
          GOT_VERSION=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")
          echo "Version $GOT_VERSION, build $(plutil -extract CFBundleVersion raw "$APP/Info.plist")"
          test "$GOT_VERSION" = "$WANT_VERSION" || { echo "::error::CFBundleShortVersionString is $GOT_VERSION, expected $WANT_VERSION"; exit 1; }
      - name: Swift errors and warnings from our sources
        if: always()
        run: |
          test -f build/xcodebuild.log || exit 0
          grep -E '/ios/App/App/[A-Za-z]+\.swift:[0-9]+:[0-9]+: (error|warning)' build/xcodebuild.log | sort -u | head -n 200 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: player-ios-xcodebuild-log
          path: apps/player/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
