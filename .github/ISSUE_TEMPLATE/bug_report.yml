name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Media-Tron version / image tag
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker with VPN (Gluetun)
        - Docker without VPN
        - From source
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact API keys, passwords and private tracker URLs.
      render: shell
